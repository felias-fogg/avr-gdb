# For finding a base image for the arm32 client that actually works, without a
# commit per attempt: the image is an input. It also reports what it got --
# which Debian the image is built on and which glibc it carries -- so a wrong
# guess is visible at once instead of halfway through a build.
#
# Why this matters now: until recently the arm client was linked statically, so
# the image's glibc did not reach the user. It is linked dynamically now, which
# makes that glibc the promise we ship. 'latest' must not decide it -- the
# action's own documentation says the latest image can change with new releases.
#
# No runtime test here. Running an armv6 client would need qemu-user in the
# outer job, and the glibc floor can be measured without executing anything:
# readelf parses ELF directly and does not care which architecture it reads.
name: Try an arm32 base image

on:
  workflow_dispatch:
    inputs:
      base_image:
        description: >
          Which base image. It has to be a Raspberry Pi OS one: Debian took
          armv6 out of armhf, so its raspi_1_* images are armel -- soft float,
          different dynamic linker -- and its armhf images are armv7. Neither
          runs where the current client runs. Pinned Pi OS names:
          raspios_lite:2023-05-03 (bullseye, glibc 2.31),
          raspios_lite:2022-04-04, raspios_lite:2021-10-30. Anything ending in
          :latest moves by itself. For a pinned bookworm base there is no name,
          only a https:// URL to a dated image, which this input also accepts.
        type: string
        default: "raspios_lite:2023-05-03"
      max_glibc_minor:
        description: >
          Highest glibc 2.x the finished client may require. Pi OS bullseye is
          31, bookworm is 36. Raise it for an attempt, not as a habit.
        type: string
        default: "31"

jobs:
  build:
    name: build on ${{ inputs.base_image }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v5

      - name: build inside the image
        uses: pguyot/arm-runner-action@v2
        with:
          # armv6, so the result runs on every Pi including the first.
          cpu: arm1176
          base_image: ${{ inputs.base_image }}
          image_additional_mb: 4096
          copy_artifact_path: arm-linux-gnueabihf.tar.gz
          commands: |
            set -x
            # What did we actually get? First thing in the log, so a wrong
            # image does not cost a whole build to notice.
            head -3 /etc/os-release
            ldd --version | head -1
            df -h /
            # No sudo: the action runs these as root inside the image, and the
            # official Debian raspi images do not ship sudo at all. Raspberry
            # Pi OS does, which is why the old workflow got away with it.
            apt-get update
            ./avr-gdb-build.sh linux32 arm
            rm -rf tool
            mkdir tool
            cp ./build/avr-linux32-arm/bin/avr-gdb tool
            cp ./build/avr-linux32-arm/package.json tool
            tar cvz --exclude="*DS_Store" --exclude="*/._*" \
                -f arm-linux-gnueabihf.tar.gz tool

      - name: what came out
        run: |
          tar xzf arm-linux-gnueabihf.tar.gz
          file tool/avr-gdb
          echo "--- dynamic dependencies ---"
          readelf -d tool/avr-gdb | grep NEEDED || echo "(none -- static build)"
          echo "--- ABI: has to stay armv6 hard-float ---"
          # Measured, not assumed. Raspberry Pi OS targets armv6 with VFP
          # arguments, which runs on every Pi from the first onwards. A Debian
          # armhf base would give armv7 and drop the Pi 1; a Debian armel base
          # would give soft float and a different interpreter, and then the
          # client does not start on Pi OS at all. Both mistakes are silent in
          # a build log and loud in a bug report.
          readelf -A tool/avr-gdb | grep -E "Tag_CPU_arch|Tag_ABI_VFP_args" || true
          readelf -l tool/avr-gdb | grep -i interpreter || echo "(no interpreter -- static)"
          if ! readelf -A tool/avr-gdb | grep -q "Tag_CPU_arch: v6"; then
            echo "::error::not built for armv6 -- this would drop the Pi 1 and Zero"
            exit 1
          fi
          if ! readelf -A tool/avr-gdb | grep -q "Tag_ABI_VFP_args: VFP registers"; then
            echo "::error::not hard-float -- this would not run on Raspberry Pi OS"
            exit 1
          fi

          echo "--- glibc ---"
          MAX=$(readelf -V tool/avr-gdb | grep -o "GLIBC_2\.[0-9]*" | sort -uV | tail -1)
          echo "highest glibc requirement: ${MAX:-none}"
          if [ -z "$MAX" ]; then
            echo "::error::no GLIBC_ references -- linked statically?"
            exit 1
          fi
          if [ "${MAX#GLIBC_2.}" -gt "${{ inputs.max_glibc_minor }}" ]; then
            echo "::error::requires $MAX, this run allowed at most GLIBC_2.${{ inputs.max_glibc_minor }}"
            exit 1
          fi

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: arm-linux-gnueabihf-${{ inputs.base_image }}
          path: arm-linux-gnueabihf.tar.gz

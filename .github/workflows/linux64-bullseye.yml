# Builds the 64-bit Intel Linux client inside a Debian 11 container, so that it
# runs on every glibc from 2.31 upwards rather than only on the one it was built
# against. Separate from the release workflow on purpose: it can be tried
# without touching a release.
#
# The build is not run with a job-level 'container:', but with docker inside a
# step. The runner injects its own Node into a job container for actions like
# checkout, and that Node needs a recent glibc -- exactly what an old base does
# not have. This way checkout and upload run on the runner and only the compiler
# runs in the container.
name: Build Linux64 on bullseye

on: [workflow_dispatch]

jobs:
  build-x86_64-linux-gnu-bullseye:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v5

      - name: build in debian:bullseye
        run: |
          docker run --rm \
            -v "$PWD":/src -w /src \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            debian:bullseye-slim bash -euxc '
              ldd --version | head -1
              # One source, named here, so the container does not depend on what
              # the image happens to carry. bullseye is still on the main mirror
              # but bullseye-security is not, and a suite that fails to update
              # leaves a stale index behind, which is what makes apt say it
              # cannot fetch an archive it thinks exists.
              echo "deb http://deb.debian.org/debian bullseye main" > /etc/apt/sources.list
              rm -f /etc/apt/sources.list.d/*
              apt-get -o Acquire::Check-Valid-Until=false update
              ./avr-gdb-build.sh linux64 intel
              # do not let a failed chown hide why the build failed
              chown -R "$HOST_UID:$HOST_GID" build tmp || true
            '

      - name: what the binary needs
        run: |
          B=build/avr-linux64-intel/bin/avr-gdb
          file "$B"
          ldd "$B"
          MAX=$(objdump -T "$B" | grep -oE "GLIBC_2\.[0-9]+" | sort -uV | tail -1)
          echo "highest glibc requirement: ${MAX:-none}"
          if [ -z "$MAX" ]; then
            echo "::error::no GLIBC_ references at all -- is this a static build again?"
            exit 1
          fi
          if [ "${MAX#GLIBC_2.}" -gt 31 ]; then
            echo "::error::expected at most GLIBC_2.31, got $MAX"
            exit 1
          fi

      - name: does it survive the charset path
        run: |
          # This is what killed the statically linked client, and it takes all
          # three parts: an ELF file, so there is a target charset to set up; a
          # language set, which discards what was cached; and then an expression,
          # because the charset is only set up when one is evaluated. Any of the
          # three alone gets through. Printing a char is the shortest way to
          # force the conversion.
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-avr avr-libc
          printf "int main(void){return 0;}\n" > probe.c
          avr-gcc -mmcu=atmega328p -O1 -g -o probe.elf probe.c
          build/avr-linux64-intel/bin/avr-gdb -nx -batch probe.elf \
            -ex "set language c" \
            -ex "print (char)65" \
            -ex "set \$ITM_BASE = 0xE0000000" \
            -ex "print \$ITM_BASE"

      - name: are the pinned options really in effect
        run: |
          CONF=$(build/avr-linux64-intel/bin/avr-gdb -nx -batch -ex "show configuration")
          for want in --without-debuginfod --disable-source-highlight \
                      --without-curses --without-lzma --without-xxhash \
                      --without-babeltrace --without-python --without-guile; do
            if ! printf '%s' "$CONF" | grep -q -- "$want"; then
              echo "::error::configuration does not report $want"
              exit 1
            fi
          done
          echo "all pinned options confirmed by the binary itself"

      - name: package
        run: |
          rm -rf tool && mkdir tool
          mv build/avr-linux64-intel/bin/avr-gdb tool
          mv build/avr-linux64-intel/package.json tool
          tar -cvz --exclude="*DS_Store" --exclude="*/._*" \
              -f x86_64-linux-gnu-bullseye.tar.gz tool

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-linux-gnu-bullseye
          path: x86_64-linux-gnu-bullseye.tar.gz
